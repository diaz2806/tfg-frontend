<div class="app-container">
  <!-- Barra superior con Angular Material -->
  <mat-toolbar color="primary" class="app-toolbar">
    <img src="../assets/logo.png" alt="App Logo" class="toolbar-logo" />
    <span class="app-title">FinCal</span>

    <span class="spacer"></span>

    <!-- ✅ MENÚ DE USUARIO CON AVATAR -->
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
      <mat-icon>account_circle</mat-icon>
      <span>{{ nombreUsuario }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="abrirPerfil()">
        <mat-icon>person</mat-icon>
        <span>Mi Perfil</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <!-- Pestañas -->
  <mat-tab-group>
    <mat-tab label="Calendario"><app-calendar /></mat-tab>
    <mat-tab label="Gastos"><app-bills /></mat-tab>
    <mat-tab label="IA"><app-ia /></mat-tab>
  </mat-tab-group>
</div>
